name: Memory check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  memory-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify memory notes still match the code
        run: node scripts/check-memory.mjs
